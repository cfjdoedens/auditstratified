name: Deploy Shiny App

on:
  push:
    branches: [main, master]

# Lost de Node.js waarschuwing op
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Nodig om downloadlimieten tijdens het installeren te voorkomen
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rsconnect
            any::remotes
            any::shiny
            any::tibble
            any::dplyr
            any::readr
            any::rhandsontable
            any::htmlwidgets
            any::ggplot2

      - name: Install package locally
        run: |
          # Installeer de app rechtstreeks uit de zojuist binnengehaalde bestanden
          # Dit voorkomt de "Unknown package" en GitHub API fouten!
          Rscript -e 'remotes::install_local(".", force = TRUE, upgrade = "never")'

      - name: Deploy to shinyapps.io
        run: |
          Rscript -e "
            # Truc: Reset de download-bron naar de standaard R website vóórdat we de app versturen
            options(repos = c(CRAN = 'https://cloud.r-project.org'))

            rsconnect::setAccountInfo(
              name = '${{ secrets.SHINYAPPS_NAME }}',
              token = '${{ secrets.SHINYAPPS_TOKEN }}',
              secret = '${{ secrets.SHINYAPPS_SECRET }}'
            )

            rsconnect::deployApp(
              appDir = 'inst/shiny/evalstratified',
              appName = 'evalstratified',
              forceUpdate = TRUE
            )
          "
