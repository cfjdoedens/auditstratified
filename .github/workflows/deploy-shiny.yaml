name: Deploy Shiny App

on:
  push:
    branches: [main, master]

# Dit lost de Node.js 20 waarschuwing op
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          # We hebben 'use-public-rspm' verwijderd om het afzender-probleem te voorkomen

      - name: Setup Fast CRAN Mirror (Binaries)
        run: |
          # We dwingen de server om de snelle Linux-versies te gebruiken, maar plakken de naam 'CRAN' erop
          echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"))' >> ~/.Rprofile
          echo 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))' >> ~/.Rprofile
        shell: bash

      - name: Install dependencies manually
        run: |
          # We installeren alles razendsnel zelf, zonder verwarrende afzender-stickers
          install.packages(c("rsconnect", "remotes", "shiny", "tibble", "dplyr", "readr", "rhandsontable", "htmlwidgets", "ggplot2"))
        shell: Rscript {0}

      - name: Install package
        run: |
          # Install from GitHub to get the metadata
          remotes::install_github("cfjdoedens/evalstratified", force = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name = Sys.getenv('SHINYAPPS_NAME'),
              token = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )

            rsconnect::deployApp(
              appDir = 'inst/shiny/evalstratified',
              appName = 'evalstratified',
              forceUpdate = TRUE
            )
          "
