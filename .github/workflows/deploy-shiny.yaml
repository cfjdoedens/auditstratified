name: Deploy Shiny App

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Zorgt ervoor dat we geen GitHub downloadlimieten raken
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install CRAN dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rsconnect
            any::remotes
            any::shiny
            any::tibble
            any::dplyr
            any::readr
            any::rhandsontable
            any::htmlwidgets
            any::ggplot2
            any::cpp11
            any::progress

      - name: Install package via remotes (Creates correct GitHub metadata for Shinyapps)
        run: |
          Rscript -e "remotes::install_github('cfjdoedens/evalstratified', force = TRUE)"

      - name: Deploy to shinyapps.io
        run: |
          Rscript -e "
            # Truc: Reset de download-bron naar de standaard R website vóórdat we de app versturen
            options(repos = c(CRAN = 'https://cloud.r-project.org'))

            rsconnect::setAccountInfo(
              name = '${{ secrets.SHINYAPPS_NAME }}',
              token = '${{ secrets.SHINYAPPS_TOKEN }}',
              secret = '${{ secrets.SHINYAPPS_SECRET }}'
            )

            rsconnect::deployApp(
              appDir = 'inst/shiny/evalstratified',
              appName = 'evalstratified',
              forceUpdate = TRUE
            )
          "
