name: Deploy Shiny App

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install packages the classic way (Bypassing GitHub's default tool)
        run: |
          Rscript -e "
            install.packages(c('remotes', 'rsconnect', 'shiny', 'tibble', 'dplyr', 'readr', 'rhandsontable', 'htmlwidgets', 'ggplot2', 'cpp11', 'progress'))

            # Installeer jouw eigen package
            remotes::install_github('cfjdoedens/auditstratified', force = TRUE)
          "

      - name: Deploy to shinyapps.io
        run: |
          Rscript -e "
            # Stel voor de zekerheid de standaard CRAN link in voor Shinyapps
            options(repos = c(CRAN = 'https://cloud.r-project.org'))

            rsconnect::setAccountInfo(
              name = '${{ secrets.SHINYAPPS_ACCOUNT }}',
              token = '${{ secrets.SHINYAPPS_TOKEN }}',
              secret = '${{ secrets.SHINYAPPS_SECRET }}'
            )

            rsconnect::deployApp(
              appDir = 'inst/shiny/auditstratified',
              appName = 'auditstratified',
              forceUpdate = TRUE
            )
          "
