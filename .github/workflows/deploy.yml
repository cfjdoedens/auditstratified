name: Check en Deploy Shiny App

# Wanneer moet dit script draaien?
on:
  push:
    branches:
      - master # (Verander dit naar 'master' als jouw hoofd-branch master heet)

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Code ophalen
        uses: actions/checkout@v3

      - name: R installeren
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Pandoc installeren (nodig voor het PDF rapport)
        uses: r-lib/actions/setup-pandoc@v2

      - name: R packages en dependencies installeren
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::rsconnect

      # DE POORTWACHTER: Deze stap test je package!
      - name: R CMD check draaien
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "error")
        shell: Rscript {0}

      # DE LIVE-GANG: Voert alléén uit als de vorige stap geen errors had
      - name: Deploy naar shinyapps.io
        if: success()
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          # 1. Inloggen met de veilige secrets
          rsconnect::setAccountInfo(name=Sys.getenv("SHINYAPPS_ACCOUNT"),
                                    token=Sys.getenv("SHINYAPPS_TOKEN"),
                                    secret=Sys.getenv("SHINYAPPS_SECRET"))

          # 2. De app naar de server sturen (Let op: check of dit pad klopt!)
          rsconnect::deployApp(appDir = "inst/shiny/evalstratified", appName = "evalstratified", forceUpdate = TRUE)        shell: Rscript {0}
